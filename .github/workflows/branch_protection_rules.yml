name: Set Branch Protection Rules

on:
  create:
    branches:
      - develop
      - main
      - master
      - prod

jobs:
  protect-branches:
    name: Apply Branch Protections
    runs-on: athena-runner

    steps:
      - name: Set Branch Protection Rules for `develop`
        run: |
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GIT_TOKEN_AUTOMATION }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/branches/develop/protection \
            -d '{
              "required_status_checks": {
                "strict": false,
                "contexts": []
              },
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "dismissal_restrictions": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                },
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false,
                "require_last_push_approval": false,
                "bypass_pull_request_allowances": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                }
              },
              "restrictions": {
                "users": [],
                "teams": []
              },
              "required_linear_history": false,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "block_creations": true,
              "required_conversation_resolution": true,
              "lock_branch": false,
              "allow_fork_syncing": true
            }'
      - name: Set Branch Protection Rules for `main`
        run: |
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GIT_TOKEN_AUTOMATION }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/branches/main/protection \
            -d '{
              "required_status_checks": {
                "strict": false,
                "contexts": []
              },
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "dismissal_restrictions": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                },
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false,
                "require_last_push_approval": false,
                "bypass_pull_request_allowances": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                }
              },
              "restrictions": {
                "users": [],
                "teams": []
              },
              "required_linear_history": false,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "block_creations": true,
              "required_conversation_resolution": true,
              "lock_branch": false,
              "allow_fork_syncing": true
            }'
      - name: Set Branch Protection Rules for `master`
        run: |
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GIT_TOKEN_AUTOMATION }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/branches/master/protection \
            -d '{
              "required_status_checks": {
                "strict": false,
                "contexts": []
              },
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "dismissal_restrictions": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                },
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false,
                "require_last_push_approval": false,
                "bypass_pull_request_allowances": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                }
              },
              "restrictions": {
                "users": [],
                "teams": []
              },
              "required_linear_history": false,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "block_creations": true,
              "required_conversation_resolution": true,
              "lock_branch": false,
              "allow_fork_syncing": true
            }'
      - name: Set Branch Protection Rules for `prod`
        run: |
          curl -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GIT_TOKEN_AUTOMATION }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/branches/prod/protection \
            -d '{
              "required_status_checks": {
                "strict": false,
                "contexts": []
              },
              "enforce_admins": true,
              "required_pull_request_reviews": {
                "dismissal_restrictions": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                },
                "dismiss_stale_reviews": true,
                "require_code_owner_reviews": false,
                "require_last_push_approval": false,
                "bypass_pull_request_allowances": {
                  "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                  "teams": []
                }
              },
              "restrictions": {
                "users": [],
                "teams": []
              },
              "required_linear_history": false,
              "allow_force_pushes": false,
              "allow_deletions": false,
              "block_creations": true,
              "required_conversation_resolution": true,
              "lock_branch": true,
              "allow_fork_syncing": true
            }'

      - name: Set Branch Protection Rules for Other Branches (except develop, main, master, prod)
        run: |
            # Loop through all branches (excluding develop, main, master, prod)
            branches=$(curl -s -H "Authorization: Bearer ${{ secrets.GIT_TOKEN_AUTOMATION }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/branches | jq -r '.[].name')
      
            for branch in $branches; do
              if [[ ! "$branch" =~ ^(develop|main|master|prod)$ ]]; then
                curl -L \
                  -X PUT \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer ${{ secrets.GIT_TOKEN_AUTOMATION }}" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  https://api.github.com/repos/${{ github.repository }}/branches/$branch/protection \
                  -d '{
                    "required_status_checks": {
                      "strict": false,
                      "contexts": ["Validate Commit Messages"]
                    },
                    "enforce_admins": false,
                    "required_pull_request_reviews": {
                      "dismissal_restrictions": {
                        "users": [],
                        "teams": []
                      },
                      "dismiss_stale_reviews": false,
                      "require_code_owner_reviews": false,
                      "require_last_push_approval": false,
                      "bypass_pull_request_allowances": {
                          "users": ["adedayoakande", "spiro-pravin-rathod", "tejasspironet", "spiro-sagar", "abhishekbhilare123", "Vikasn8"],
                          "teams": []
                        }
                      }
                    },
                    "restrictions": {
                      "users": [],
                      "teams": []
                    },
                    "required_linear_history": false,
                    "allow_force_pushes": false,
                    "allow_deletions": false,
                    "block_creations": false,
                    "required_conversation_resolution": false,
                    "lock_branch": false,
                    "allow_fork_syncing": false
                  }'
              fi
            done
