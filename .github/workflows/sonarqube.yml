name: Sonarqube Scan

on:
  push:
    branches:
      - '**'
      - '!main'
      - '!master'
      - '!develop'
      - '!prod'

jobs:
  build:
    name: Trivy Scan and SonarQube
    runs-on: sonarqube-runner-agent

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java Version
        run: |
          echo "Checking Java version..."
          java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission to gradlew
        run: |
          echo "Granting execute permission to gradlew..."
          chmod +x ./gradlew

      - name: Verify Gradle Version
        run: |
          echo "Checking Gradle version..."
          ./gradlew --version

      - name: Build with Gradle
        run: |
          echo "Starting Gradle build..."
          ./gradlew clean build
