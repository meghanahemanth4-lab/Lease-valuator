
# Required metadata
sonar.projectKey=sap-lease-valuator-service
sonar.projectName=Sap-Lease-Valuator-Service

# Path to source code
sonar.sources=src/main/java , build.gradle

# Path to test code
sonar.tests=src/test/java

# Path to binaries (classes)
sonar.java.binaries=build/classes/java/main

# Path to test binaries (optional if different from main binaries path)
sonar.java.test.binaries=build/classes/java/test

# Report paths for JaCoCo
sonar.jacoco.reportPaths=build/jacoco/test.exec
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Trivy Isseus
sonar.externalIssuesReportPaths=sonarqube.json

# Language
sonar.language=java

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Optional, if you use an SCM system
sonar.scm.provider=git

# Additional properties if needed
# sonar.exclusions=**/*Generated*.java

# SonarQube server URL
# Default is http://localhost:9000
sonar.host.url=https://sonarqube.spiroiothub.com

# Optional: include other report paths (e.g., for HTML, XML, JSON, CSV)
sonar.dependencyCheck.htmlReportPath=dependency-check-report.html
sonar.dependencyCheck.jsonReportPath=dependency-check-report.json
sonar.dependencyCheck.csvReportPath=dependency-check-report.csv