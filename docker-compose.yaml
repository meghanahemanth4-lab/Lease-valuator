version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: lease-valuator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-boot-postgres-network
    # restart: always

  app:
    image: lva:latest
    container_name: spring-boot-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_OUTPUT_ANSI_ENABLED: ALWAYS
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_PATTERN_CONSOLE: '%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} : %m%n'
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lease-valuator
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_ENABLED: true
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/lease-valuator
      SPRING_FLYWAY_USER: postgres
      SPRING_FLYWAY_PASSWORD: postgres
      SPRING_FLYWAY_SCHEMAS: contract
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    networks:
      - spring-boot-postgres-network
    # restart: always

networks:
  spring-boot-postgres-network:

volumes:
  postgres_data:
