plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.2'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'jacoco' // Added JaCoCo plugin
}

group = 'com.spinteg'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core:9.2.0' // Updated Flyway dependency
	implementation 'org.projectlombok:lombok:1.18.24'
	// OpenCSV Dependency
	implementation 'com.opencsv:opencsv:5.7.1'

	// Jackson Dependencies
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.1'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.14.1' // Core Jackson library

	runtimeOnly 'org.postgresql:postgresql:42.6.0'
	annotationProcessor 'org.projectlombok:lombok:1.18.24'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:testcontainers:1.18.3'
	testImplementation 'org.testcontainers:junit-jupiter:1.18.3'
	testImplementation 'org.testcontainers:postgresql:1.18.3'
	// Springdoc OpenAPI dependency
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport // Ensure JaCoCo runs after tests
}

jacoco {
	toolVersion = "0.8.8" // Use the latest JaCoCo version
}

jacocoTestReport {
	dependsOn test // Ensure tests run before generating the report
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

sourceSets {
	test {
		java {
			srcDirs = ['src/test/java']
		}
		resources {
			srcDirs = ['src/test/resources']
		}
	}
}
