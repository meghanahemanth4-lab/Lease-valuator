spring.application.name=lv

# PostgreSQL settings (common)
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings (common)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway settings (common)
spring.flyway.enabled=true
spring.flyway.schemas=contract
spring.flyway.locations=classpath:db/migration
spring.flyway.repeatable-sql-migration-prefix=R

management.endpoints.web.exposure.include=*
logging.loki.username=spiro_loki_user
logging.loki.password=Sp!roLog@2025$
logging.config=classpath:logback-spring.xml


# Local database settings
spring.datasource.url=jdbc:postgresql://localhost:5432/lease-valuator
spring.datasource.username=postgres
spring.datasource.password=postgres