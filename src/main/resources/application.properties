spring.application.name=lv
# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true
# PostgreSQL settings (common)
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings (common)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=contract
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# Disable Spring Data REST completely
spring.data.rest.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.rest.RepositoryRestMvcAutoConfiguration,org.springframework.boot.autoconfigure.data.web.SpringDataWebAutoConfiguration

# Flyway settings (common)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.repeatable-sql-migration-prefix=R

# JWT Setting
app.jwt.secret=PBBED5VCfq6DkBprPm+KguDgEZshMRNEVwlhFMldx3uCb05AGa7ME+lJBtwX7k0lp5JiD+Yml4tL+hXfPO5Tvg==

app.jwt.expiration-ms=86400000


# Security settings

# Logging settings
logging.loki.username=spiro_loki_user
logging.loki.password=Sp!roLog@2025$
logging.config=classpath:logback-spring.xml

# Local database settings
spring.datasource.url=jdbc:postgresql://localhost:5432/lease-valuator
spring.datasource.username=postgres
spring.datasource.password=postgres

# CORS Configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Security Configuration
spring.security.filter.dispatcher-types=REQUEST,ERROR,ASYNC

# ===================================================================
# SPRINGDOC OPENAPI CONFIGURATION
# ===================================================================

# Enable/disable OpenAPI documentation
docs.api-docs.enabled=true

# API Documentation path (default: /v3/api-docs)
springdoc.api-docs.path=/v3/api-docs

# Swagger UI configuration
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Disable Spring Data REST completely
spring.data.rest.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.rest.RepositoryRestMvcAutoConfiguration

# SpringDoc Configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# Disable all Spring Data REST and JPA repository documentation
springdoc.api-docs.resolve-schema-properties=false
springdoc.model-converter.deprecating-converter.enabled=false
springdoc.data-rest.enabled=false
springdoc.jpa-query-by-example.enabled=false
springdoc.model-converters.schema-resolver.enabled=false
springdoc.show-actuator=false

# Disable Spring Data REST auto-configuration
spring.data.rest.detection-strategy=annotated
spring.data.rest.base-path=/api

# Explicitly include only the controllers we want to document
springdoc.packagesToScan=com.spinteg.lv.controller,com.spinteg.lv.api

# Disable default response messages
springdoc.default-produces-media-type=application/json
springdoc.model-converters.jackson-not-present-ignore-errors=true

# Actuator endpoints configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized

